.shade{position:fixed;inset:0;background:radial-gradient(80% 70% at 50% 45%,#00000073,#000000d9),linear-gradient(0deg,#000000cc,#00000066 50%,#000000b3)}
header{position:relative;z-index:2;padding:22px clamp(18px,4.5vw,64px)}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:clamp(1.3rem,2.6vw,1.9rem);letter-spacing:.05em;color:var(--blue)}
.logo svg{width:1.15em;height:1.15em;fill:currentColor}
main{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:10px 16px 50px}
.card{width:min(430px,100%);background:#0b101ac7;border:1px solid #ffffff1f;border-radius:16px;padding:clamp(22px,4vw,36px);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 30px 80px #000a}
h1{font-weight:700;font-size:1.75rem;letter-spacing:-.025em;margin-bottom:6px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:22px}
#gbtn{display:flex;justify-content:center;min-height:44px}
.or{display:flex;align-items:center;gap:14px;margin:18px 0;color:var(--muted);font-size:.8rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:#ffffff33}
[hidden]{display:none!important}
.f{margin-bottom:14px}
label{display:block;font-size:.8rem;font-weight:500;color:var(--muted);margin-bottom:6px}
.in{display:flex;align-items:center;background:#ffffff12;border:1px solid #ffffff2e;border-radius:9px;transition:border-color .15s,background .15s}
.in:focus-within{border-color:var(--blue);background:#ffffff1a}
.in input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:.95rem;padding:13px 14px}
.in input::placeholder{color:#8794ab}
.in button{background:none;border:0;color:var(--muted);font:inherit;font-size:.78rem;padding:0 14px;cursor:pointer;align-self:stretch}
.in button:hover{color:#fff}
.meter{display:flex;gap:4px;margin-top:8px;align-items:center}
.meter i{flex:1;height:4px;border-radius:4px;background:#ffffff26}
.meter span{font-size:.72rem;color:var(--muted);min-width:56px;text-align:right}
.hint{font-size:.74rem;color:var(--muted);margin-top:6px}
.go{width:100%;margin-top:6px;background:var(--blue);color:#fff;border:0;border-radius:9px;font:inherit;font-weight:600;font-size:1rem;padding:14px;cursor:pointer;transition:filter .15s,transform .1s}
.go:hover{filter:brightness(1.14)}.go:active{transform:translateY(1px)}
.go[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.3em;font-size:.86rem;margin:2px 0 10px}
.msg.err{color:var(--err)}
.swap{margin-top:20px;text-align:center;color:var(--muted);font-size:.88rem}
.swap button{background:none;border:0;color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.swap button:hover{color:var(--blue)}
.small{margin-top:14px;text-align:center;color:#8f9bb1;font-size:.76rem;line-height:1.5}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.bg{transition:none}}
</style>
</head>
<body>
<div class="bg on" id="b1"></div><div class="bg" id="b2"></div><div class="shade"></div>

<header><div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l16 9-16 9z"/></svg>STREAMLY</div></header>

<main>
  <div class="card" id="card">
    <h1 id="title">Welcome back</h1>
    <p class="sub" id="sub">Sign in to browse movies and shows and keep your list.</p>

    <div id="gwrap" hidden>
      <div id="gbtn"></div>
      <div class="or">or continue with email</div>
    </div>

    <!-- sign in -->
    <form id="fin" novalidate>
      <div class="f"><label for="si-id">Email</label>
        <div class="in"><input id="si-id" type="text" placeholder="you@example.com" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus></div></div>
      <div class="f"><label for="si-pw">Password</label>
        <div class="in"><input id="si-pw" type="password" placeholder="Your password" autocomplete="current-password"><button type="button" data-eye="si-pw">Show</button></div></div>
      <div class="msg err" id="m-in" role="alert" aria-live="polite"></div>
      <button class="go" type="submit" id="go-in">Sign in</button>
      <p class="small">Forgot your password? Password reset by email isn’t available yet – ask your administrator.</p>
    </form>

    <!-- create account -->
    <form id="fup" novalidate hidden>
      <div class="f"><label for="su-name">Full name</label>
        <div class="in"><input id="su-name" type="text" placeholder="Your name" autocomplete="name" maxlength="60"></div></div>
      <div class="f"><label for="su-email">Email</label>
        <div class="in"><input id="su-email" type="email" placeholder="you@example.com" autocomplete="email" autocapitalize="none" spellcheck="false"></div></div>
      <div class="f"><label for="su-pw">Password</label>
        <div class="in"><input id="su-pw" type="password" placeholder="At least 8 characters" autocomplete="new-password"><button type="button" data-eye="su-pw">Show</button></div>
        <div class="meter" id="meter"><i></i><i></i><i></i><i></i><span id="mlabel"></span></div></div>
      <div class="msg err" id="m-up" role="alert" aria-live="polite"></div>
      <button class="go" type="submit" id="go-up">Create account</button>
    </form>

    <div class="swap" id="swap"></div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
let cfg = { signup: false, googleClientId: null }, mode = 'in';

// background slideshow
let on = 1;
setInterval(() => {
  if (document.hidden) return;
  on = on === 1 ? 2 : 1;
  $('#b1').classList.toggle('on', on === 1);
  $('#b2').classList.toggle('on', on === 2);
}, 7000);

// sign in <-> create account
function setMode(m) {
  mode = m;
  const up = m === 'up';
  $('#fin').hidden = up; $('#fup').hidden = !up;
  $('#title').textContent = up ? 'Create your account' : 'Welcome back';
  $('#sub').textContent = up ? 'It’s free. Save your list and pick up where you left off.' : 'Sign in to browse movies and shows and keep your list.';
  $('#m-in').textContent = ''; $('#m-up').textContent = '';
  $('#swap').innerHTML = up
    ? 'Already have an account? <button type="button" id="sw">Sign in</button>'
    : (cfg.signup ? 'New to Streamly? <button type="button" id="sw">Create an account</button>' : '');
  const sw = $('#sw'); if (sw) sw.onclick = () => setMode(up ? 'in' : 'up');
  setTimeout(() => $(up ? '#su-name' : '#si-id').focus(), 0);
}

// show / hide password
document.querySelectorAll('[data-eye]').forEach((b) => b.onclick = () => {
  const i = $('#' + b.dataset.eye), show = i.type === 'password';
  i.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show';
});

// password strength
$('#su-pw').oninput = (e) => {
  const v = e.target.value; let n = 0;
  if (v.length >= 8) n++; if (v.length >= 12) n++;
  if (/[a-z]/.test(v) && /[A-Z]/.test(v)) n++; if (/\d/.test(v) && /[^A-Za-z0-9]/.test(v)) n++;
  if (!v) n = 0;
  const bars = document.querySelectorAll('#meter i');
  const col = ['#ff6b6b', '#ffb347', '#d9d94a', '#46d369'][Math.max(0, n - 1)];
  bars.forEach((b, i) => b.style.background = i < n ? col : '');
  $('#mlabel').textContent = v ? ['Weak', 'Okay', 'Good', 'Strong'][Math.max(0, n - 1)] : '';
};

async function post(url, body, msgEl, btn, label) {
  msgEl.textContent = ''; btn.disabled = true; btn.textContent = 'Please wait…';
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { location.href = '/'; return; }
    msgEl.textContent = d.error || 'Something went wrong. Please try again.';
  } catch { msgEl.textContent = 'Could not reach the server. Check your connection.'; }
  btn.disabled = false; btn.textContent = label;
}
$('#fin').onsubmit = (e) => {
  e.preventDefault();
  const email = $('#si-id').value.trim(), password = $('#si-pw').value;
  if (!email || !password) { $('#m-in').textContent = 'Enter your email and password.'; return; }
  post('/api/login', { email, password }, $('#m-in'), $('#go-in'), 'Sign in');
};
$('#fup').onsubmit = (e) => {
  e.preventDefault();
  const name = $('#su-name').value.trim(), email = $('#su-email').value.trim(), password = $('#su-pw').value;
  const m = $('#m-up');
  if (!name) { m.textContent = 'Enter your name.'; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { m.textContent = 'Enter a valid email address.'; return; }
  if (password.length < 8) { m.textContent = 'Your password must be at least 8 characters.'; return; }
  post('/api/signup', { name, email, password }, m, $('#go-up'), 'Create account');
};

// Google button (appears once GOOGLE_CLIENT_ID is set on the server)
async function onGoogle(resp) {
  const m = mode === 'up' ? $('#m-up') : $('#m-in'); m.textContent = '';
  try {
    const r = await fetch('/api/login/google', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: resp.credential }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { location.href = '/'; return; }
    m.textContent = d.error || 'Google sign-in failed. Try again.';
  } catch { m.textContent = 'Could not reach the server. Check your connection.'; }
}
fetch('/api/auth-config').then((r) => r.json()).catch(() => ({})).then((c) => {
  cfg = { ...cfg, ...c };
  setMode('in');
  if (!cfg.googleClientId) return;
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
  s.onload = () => {
    google.accounts.id.initialize({ client_id: cfg.googleClientId, callback: onGoogle });
    const w = Math.max(200, Math.min(380, $('#card').clientWidth - 2 * 22));
    google.accounts.id.renderButton($('#gbtn'), { theme: 'filled_blue', size: 'large', shape: 'rectangular', text: 'continue_with', logo_alignment: 'left', width: w });
    $('#gwrap').hidden = false;
  };
  document.head.appendChild(s);
});
setMode('in');
</script>
